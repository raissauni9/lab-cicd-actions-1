<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site - Vai Flamengo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #000000 50%, #c8102e 50%);
      padding: 1rem;
    }

    .cartao {
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
      text-align: center;
      color: #1d1d1f;
      border: 3px solid #c8102e;
      background-color: #ffffff;
      border-radius: 8px;
    }

    .emoji { 
      font-size: 4rem; 
    }

    h1 { 
      margin: .5rem 0; 
      color: #c8102e; 
    }

    .versao {
      margin-top: 1.5rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="emoji">❤️</div>
    <h1>Vai Flamengo</h1>
    <p>O erro foi corrigido e o robô publicou de novo.</p>
    <div class="versao">
      <p>Versão 3 — corrigida</p>
    </div>
  </main>
</body>
</html>
